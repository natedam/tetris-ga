# Champions test for E2-E4 (RQ2, RQ3): every GA run's champion plays the same
# 20 held-out test games on the training board (10x10, no cap). This gives the
# final, unbiased score of each run, used to compare population sizes (E2),
# mutation rates (E3) and selection/crossover operators (E4).
# Run E2, E3 and E4 first.
name: E2-E4_champions
type: evaluate
test_games: 20
board_width: 10
board_height: 10
max_pieces: null          # no cap: play until game over
players:
  - ga-all:default                                # pop 50, mutation 0.05, tournament + arithmetic
  - ga-all:population_size=20                     # E2
  - ga-all:population_size=100                    # E2
  - ga-all:mutation_rate=0.01                     # E3
  - ga-all:mutation_rate=0.15                     # E3
  - ga-all:crossover=uniform                      # E4: tournament + uniform
  - ga-all:selection=roulette                     # E4: roulette + arithmetic
  - ga-all:crossover=uniform+selection=roulette   # E4: roulette + uniform
